# ================================================================
# logstash.conf — Pipeline con enrutamiento de índices
# ================================================================
# Índices resultantes:
#   apps-{app_name}-YYYY.MM.dd  → una app concreta
#   sistema-YYYY.MM.dd          → syslog, auth, kernel, cron, vmware...
#   docker-YYYY.MM.dd           → contenedores Docker
#   logstash-YYYY.MM.dd         → fallback
#
# Data Views en Kibana:
#   apps-*                      → todas las apps
#   apps-apitest-*              → solo una app
#   sistema-*                   → logs de sistema
#   docker-*                    → contenedores
#   apps-*,sistema-*,docker-*,logstash-*  → todo
# ================================================================

input {
  beats {
    port => 5044
  }
  tcp {
    port => 50000
    codec => json
  }
}


# ================================================================
# FILTER
# ================================================================
filter {

  # --------------------------------------------------------------
  # NORMALIZACIÓN
  # Si fields_under_root no funcionó en el cliente, los campos
  # llegan como [fields][app_name] en lugar de [app_name].
  # Esto los sube al nivel raíz para que el enrutamiento funcione.
  # --------------------------------------------------------------
  if [fields][app_name] and ![app_name] {
    mutate {
      add_field => { "app_name"      => "%{[fields][app_name]}" }
      add_field => { "log_category"  => "%{[fields][log_category]}" }
      add_field => { "server_name"   => "%{[fields][server_name]}" }
      add_field => { "environment"   => "%{[fields][environment]}" }
    }
  }

  # --------------------------------------------------------------
  # ENRUTAMIENTO DE ÍNDICES
  # Orden de prioridad:
  #   1. input.type == container  → es Docker puro, va a docker-*
  #   2. app_name presente        → va a apps-{app_name}-*
  #   3. log_category de sistema  → va a sistema-*
  #   4. resto                    → fallback logstash-*
  #
  # NOTA: Se usa [input][type] == "container" en lugar de
  # "docker" in [tags] porque el processor add_docker_metadata
  # añade el tag "docker" a TODOS los eventos del host,
  # no solo a los del input container.
  # --------------------------------------------------------------

  # 1. Contenedores Docker reales (input type container)
  if [input][type] == "container" {
    mutate {
      add_field => { "[@metadata][target_index]" => "docker" }
    }
  }
  # 2. Aplicaciones (tienen app_name)
  else if [app_name] {
    mutate {
      add_field => { "[@metadata][target_index]" => "apps-%{app_name}" }
    }
  }
  # 3. Logs de sistema
  else if [log_category] in ["syslog", "kernel", "auth", "cron", "paquetes", "vmware", "apache", "php-fpm"] {
    mutate {
      add_field => { "[@metadata][target_index]" => "sistema" }
    }
  }
  # 4. Fallback
  else {
    mutate {
      add_field => { "[@metadata][target_index]" => "logstash" }
    }
  }

  # --------------------------------------------------------------
  # PARSEO — Docker: extraer campos del JSON nativo del contenedor
  # Solo para logs de tipo container
  # --------------------------------------------------------------
  if [input][type] == "container" {
    json {
      source => "message"
      target => "docker_payload"
      skip_on_invalid_json => true
    }
  }

  # --------------------------------------------------------------
  # PARSEO — auth.log: SSH y sudo
  # --------------------------------------------------------------
  if [log_category] == "auth" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP} %{HOSTNAME} sshd\[%{NUMBER}\]: Failed password for %{USER:ssh_user} from %{IP:src_ip}",
          "%{SYSLOGTIMESTAMP} %{HOSTNAME} sshd\[%{NUMBER}\]: Accepted password for %{USER:ssh_user} from %{IP:src_ip}",
          "%{SYSLOGTIMESTAMP} %{HOSTNAME} sudo: +%{USER:sudo_user} : TTY=%{DATA} ; PWD=%{DATA} ; USER=%{DATA} ; COMMAND=%{GREEDYDATA:sudo_command}"
        ]
      }
      tag_on_failure => []
    }
  }

  # --------------------------------------------------------------
  # PARSEO — Apache access log
  # --------------------------------------------------------------
  if [log_category] == "apache" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      tag_on_failure => []
    }
    if [response] {
      mutate { convert => { "response" => "integer" } }
    }
  }

  # --------------------------------------------------------------
  # CAMPO severity automático — aplica a todos los logs
  # Filtrar en Kibana: severity : "error"
  # --------------------------------------------------------------
  if [message] =~ /(?i)(critical|fatal|emergency)/ {
    mutate { add_field => { "severity" => "critical" } }
  } else if [message] =~ /(?i)(error|exception|traceback|failed|failure)/ {
    mutate { add_field => { "severity" => "error" } }
  } else if [message] =~ /(?i)(warn|warning|deprecated)/ {
    mutate { add_field => { "severity" => "warning" } }
  } else {
    mutate { add_field => { "severity" => "info" } }
  }

}


# ================================================================
# OUTPUT
# ================================================================
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
  }
}