# ================================================================
# filebeat.yml — SENTRY
# Filebeat 8.x — usa type: filestream (type: log está deprecado)
# ================================================================
# INSTRUCCIONES:
#   1. Edita la IP del servidor ELK en output.logstash si cambia
#   2. Activa/desactiva bloques con enabled: true/false
#   3. Copia a /etc/filebeat/filebeat.yml
#   4. sudo systemctl restart filebeat
# ================================================================

# ----------------------------------------------------------------
# IDENTIDAD DEL SERVIDOR
# ----------------------------------------------------------------
fields:
  server_name: "SENTRY"
  environment: "test"
  location: "proveedor cloud"
fields_under_root: true


# ================================================================
# INPUTS — type: filestream (reemplazo oficial de type: log en 8.x)
# Cada input DEBE tener un id único — obligatorio en filestream
# ================================================================
filebeat.inputs:

  # --------------------------------------------------------------
  # APPS — Sentry projects
  # --------------------------------------------------------------
  - type: filestream
    id: app-adminsirajtest
    enabled: true
    paths:
      - /var/log/apache2/domains/adminsirajtest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "adminsirajtest"
      app_name: "adminsirajtest"
    fields_under_root: true

  - type: filestream
    id: app-apitest
    enabled: true
    paths:
      - /var/log/apache2/domains/apitest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "apitest"
      app_name: "apitest"
    fields_under_root: true

  - type: filestream
    id: app-clave-dev
    enabled: true
    paths:
      - /var/log/apache2/domains/clave-dev*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "clave-dev"
      app_name: "clave-dev"
    fields_under_root: true

  - type: filestream
    id: app-cp-help-test
    enabled: true
    paths:
      - /var/log/apache2/domains/cp-help-test*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "cp-help-test"
      app_name: "cp-help-test"
    fields_under_root: true

  - type: filestream
    id: app-csvtest
    enabled: true
    paths:
      - /var/log/apache2/domains/csvtest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "csvtest"
      app_name: "csvtest"
    fields_under_root: true

  - type: filestream
    id: app-gitea
    enabled: true
    paths:
      - /var/log/git*.log
      - /var/log/apache2/domains/git*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "gitea"
      app_name: "gitea"
    fields_under_root: true

  - type: filestream
    id: app-loutest
    enabled: true
    paths:
      - /var/log/apache2/domains/loutest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "loutest"
      app_name: "loutest"
    fields_under_root: true

  - type: filestream
    id: app-monitorproxycolastest
    enabled: true
    paths:
      - /var/log/apache2/domains/monitorproxycolastest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "monitorproxycolastest"
      app_name: "monitorproxycolastest"
    fields_under_root: true

  - type: filestream
    id: app-ocapitest
    enabled: true
    paths:
      - /var/log/apache2/domains/ocapitest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "ocapitest"
      app_name: "ocapitest"
    fields_under_root: true

  - type: filestream
    id: app-organoscolegiadostest
    enabled: true
    paths:
      - /var/log/apache2/domains/organoscolegiadostest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "organoscolegiadostest"
      app_name: "organoscolegiadostest"
    fields_under_root: true

  - type: filestream
    id: app-plantillatest
    enabled: true
    paths:
      - /var/log/apache2/domains/plantillatest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "plantillatest"
      app_name: "plantillatest"
    fields_under_root: true

  - type: filestream
    id: app-proxytest
    enabled: true
    paths:
      - /var/log/apache2/domains/proxytest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "proxytest"
      app_name: "proxytest"
    fields_under_root: true

  - type: filestream
    id: app-rabbitmqoctest
    enabled: true
    paths:
      - /var/log/rabbitmqoctest*.log
      - /var/log/rabbitmq*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "rabbitmqoctest"
      app_name: "rabbitmqoctest"
    fields_under_root: true

  - type: filestream
    id: app-siraj2moviltest
    enabled: true
    paths:
      - /var/log/apache2/domains/siraj2moviltest*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "siraj2moviltest"
      app_name: "siraj2moviltest"
    fields_under_root: true

  - type: filestream
    id: app-wikidesarrollo
    enabled: true
    paths:
      - /var/log/apache2/domains/wikidesarrollo*.log
    tags: ["app", "sentry-project"]
    fields:
      log_category: "wikidesarrollo"
      app_name: "wikidesarrollo"
    fields_under_root: true

  # --------------------------------------------------------------
  # SISTEMA — separados para granularidad en Kibana
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-syslog
    enabled: true
    paths:
      - /var/log/syslog
    tags: ["sistema", "syslog"]
    fields:
      log_category: "syslog"
    fields_under_root: true

  - type: filestream
    id: sistema-kernel
    enabled: true
    paths:
      - /var/log/kern.log
    tags: ["sistema", "kernel"]
    fields:
      log_category: "kernel"
    fields_under_root: true

  - type: filestream
    id: sistema-auth
    enabled: true
    paths:
      - /var/log/auth.log
    tags: ["sistema", "seguridad", "auth"]
    fields:
      log_category: "auth"
    fields_under_root: true

  - type: filestream
    id: sistema-cron
    enabled: true
    paths:
      - /var/log/cron
      - /var/log/cron.log
    tags: ["sistema", "cron"]
    fields:
      log_category: "cron"
    fields_under_root: true

  - type: filestream
    id: sistema-paquetes
    enabled: true
    paths:
      - /var/log/alternatives.log
      - /var/log/dpkg.log
    tags: ["sistema", "paquetes"]
    fields:
      log_category: "paquetes"
    fields_under_root: true

  # --------------------------------------------------------------
  # APACHE
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-apache
    enabled: false
    paths:
      - /var/log/apache2/access.log
      - /var/log/apache2/error.log
    tags: ["sistema", "apache", "web"]
    fields:
      log_category: "apache"
    fields_under_root: true

  # --------------------------------------------------------------
  # PHP-FPM
  # --------------------------------------------------------------
  - type: filestream
    id: app-php-fpm
    enabled: true
    paths:
      - /var/log/php*-fpm.log
    tags: ["app", "php"]
    fields:
      log_category: "php-fpm"
      app_name: "php-fpm"
    fields_under_root: true
    parsers:
      - multiline:
          type: pattern
          pattern: '^\[\d{4}-\d{2}-\d{2}'
          negate: true
          match: after

  # --------------------------------------------------------------
  # VMWARE
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-vmware
    enabled: true
    paths:
      - /var/log/vmware-network*.log
      - /var/log/vmware-vmsvc-root*.log
      - /var/log/vmware-vmtoolsd-root*.log
    tags: ["sistema", "vmware"]
    fields:
      log_category: "vmware"
    fields_under_root: true

  # --------------------------------------------------------------
  # FAIL2BAN
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-fail2ban
    enabled: true
    paths:
      - /var/log/fail2ban.log
    tags: ["sistema", "seguridad", "fail2ban"]
    fields:
      log_category: "fail2ban"
    fields_under_root: true

  # --------------------------------------------------------------
  # NGINX
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-nginx
    enabled: true
    paths:
      - /var/log/nginx/*.log
      - /var/log/nginx/**/*.log
    tags: ["sistema", "nginx", "web"]
    fields:
      log_category: "nginx"
    fields_under_root: true

  # --------------------------------------------------------------
  # MONGODB
  # --------------------------------------------------------------
  - type: filestream
    id: app-mongodb
    enabled: true
    paths:
      - /var/log/mongodb/*.log
    tags: ["app", "bbdd", "mongodb"]
    fields:
      log_category: "mongodb"
      app_name: "mongodb"
    fields_under_root: true

  # --------------------------------------------------------------
  # USER.LOG — logs de aplicaciones de usuario
  # --------------------------------------------------------------
  - type: filestream
    id: sistema-userlog
    enabled: true
    paths:
      - /var/log/user.log
    tags: ["sistema", "user"]
    fields:
      log_category: "userlog"
    fields_under_root: true

  # --------------------------------------------------------------
  # DOCKER — contenedores
  # type: container sigue siendo el correcto para Docker
  # añadir allow_deprecated_use: true requerido en Filebeat 8.x
  # --------------------------------------------------------------
  - type: container
    allow_deprecated_use: true
    id: docker-containers
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    tags: ["docker", "contenedor"]
    fields:
      log_category: "docker"
    fields_under_root: true
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"


# ================================================================
# PROCESADORES GLOBALES
# ================================================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_locale:
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs.version"]
      ignore_missing: true


# ================================================================
# OUTPUT
# ================================================================
output.logstash:
  hosts: ["10.20.173.250:5044"]


# ================================================================
# LOGGING DE FILEBEAT
# ================================================================
logging.level: warning
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644